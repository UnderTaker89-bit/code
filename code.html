<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Типи даних</title>
</head>
<body>
    <script>
        // Завдання 1

        function printTypeInfo(expressionString, value) {
            console.log(`${expressionString} -> Значення: ${value} (Тип: ${typeof value})`);
        }

        printTypeInfo('"10" + 5', "10" + 5);
        printTypeInfo('"10" - 5', "10" - 5);
        printTypeInfo('"10" * "2"', "10" * "2");
        printTypeInfo('10 + true', 10 + true);
        printTypeInfo('10 + false', 10 + false);
        printTypeInfo('Number("125 грн")', Number("125 грн"));
        printTypeInfo('Number("")', Number(""));
        printTypeInfo('Boolean("false")', Boolean("false"));
        printTypeInfo('Boolean("")', Boolean(""));


        // Завдання 2
        const orderItems = [
            { Назва: "Ноутбук", price: 25000, quantity: 1 },
            { Назва: "Мишка", price: 600, quantity: 2 },
            { Назва: "Клавіатура", price: 1500, quantity: 1 }
        ];

        const VAT_RATE = 0.20;

        function ItemCostCalculator(item) {
            return item.price * item.quantity;
        }

        function OrderSumCalculator(items, vatRate, vatResultsArray) {
            let totalOrderCost = 0;

            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                const itemCost = ItemCostCalculator(item);
                const itemVat = itemCost * vatRate;

                vatResultsArray.push({
                    Назва: item.Назва,
                    ПДВ: itemVat
                });

                totalOrderCost += itemCost;
            }

            return totalOrderCost;
        }

        const vatList = [];
        const totalSum = OrderSumCalculator(orderItems, VAT_RATE, vatList);

        console.log(`Загальна вартість замовлення: ${totalSum} грн`);
        console.log("Результати розрахунку ПДВ для кожного товару:", vatList);
    </script>
</body>
</html>
